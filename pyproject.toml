[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdamt-snipe"
version = "1.4.5"
description = "Async-first web security reconnaissance framework for authorized assessments."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Samasta Baskara (Verdammt)" }]
keywords = ["security", "reconnaissance", "pentesting", "bug-bounty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "Brotli==1.2.0",
  "curl_cffi==0.16.3",
  "httpx[http2]==0.28.1",
  "lxml==6.1.2",
  "playwright==1.63.0",
  "python-interactsh @ git+https://github.com/theori-io/python-interactsh.git@f5ddbdba4b5127d70504562899d2795e0d79ed9c",
  "rich==15.0.0",
  "weasyprint==70.0; sys_platform != \"win32\"",
  "PySocks==1.7.1",
  "PyJWT==2.15.1",
  "mmh3==5.3.1",
  "psutil==7.2.2",
]

[project.scripts]
verdamt-snipe = "verd:main"

[tool.setuptools]
py-modules = ["verd"]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "reports*", "runners*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["dump", ".venv"]

[tool.ruff.lint]
ignore = [
    # Per-probe exception isolation is this scanner's core resilience
    # contract: a dead probe must never take the whole scan down, and
    # best-effort cleanup (socket close, resource release) must not mask
    # the primary error. Reviewed per-file during the 2026-10-17 audit.
    "BLE001",  # blind-except at probe boundaries
    "S110",    # try-except-pass in best-effort cleanup
    "S112",    # try-except-continue in per-item scan loops
    # Annotation-only modernization (add ClassVar) across 41 class
    # bodies; no safe autofix exists and it changes no runtime behavior.
    # Deferred deliberately, not forgotten.
    "RUF012",
]

[tool.coverage.run]
branch = true
source = ["core", "modules", "reports", "runners", "verd"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Floor set at the measured 2026-10-17 baseline (42%) — coverage can only
# go up from here; lowering this number requires an explicit commit.
fail_under = 42
